<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/styles/base.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/styles/header.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/styles/loader.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/styles/footer.css' | relative_url }}">
  {% for style in page.styles %}
    <link rel="stylesheet" href="{{ '/styles/' | append: style | relative_url }}">
  {% endfor %}
</head>
<body>
  {% include loader.html %}
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <script src="{{ '/scripts/loader.js' | relative_url }}" defer></script>
</body>
</html>
